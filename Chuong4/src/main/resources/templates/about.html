<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Giới Thiệu</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    </head>

    <body class="bg-light">
        <div th:replace="~{header :: nav}"></div>

        <div class="container col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h3 class="card-title text-success mb-3">Thông Tin Khóa Học</h3>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><strong>Môn học:</strong> <span th:text="${course}"></span></li>
                        <li class="list-group-item"><strong>Nội dung:</strong> <span th:text="${chapter}"></span></li>
                    </ul>
                </div>
            </div>
        </div>
    </body>
</html>
