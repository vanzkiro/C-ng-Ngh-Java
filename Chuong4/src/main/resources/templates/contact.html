<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Liên Hệ</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    </head>

    <body class="bg-light text-center" >
        <div th:replace="~{header :: nav}"></div>

        <div class="container col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0 fs-5">Thông Tin Liên Hệ</h4>
                </div>
                <div class="card-body">
                    <p class="card-text"><strong>Khoa/Bộ môn:</strong> <span th:text="${department}"></span></p>
                    <p class="card-text"><strong>Email:</strong> <span th:text="${email}"></span></p>
                    <p class="card-text"><strong>Điện thoại:</strong> <span th:text="${phone}"></span></p>
                    <p class="card-text"><strong>Địa chỉ:</strong> <span th:text="${address}"></span></p>
                </div>
            </div>
        </div>
    </body>
</html>
