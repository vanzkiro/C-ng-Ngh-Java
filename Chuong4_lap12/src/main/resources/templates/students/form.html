<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Thêm Sinh Viên</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 th:text="${student.id == null ? 'Thêm Sinh Viên Mới' : 'Cập Nhật Sinh Viên'}">Thêm Sinh Viên</h2>

                <form th:action="@{/students/save}" th:object="${student}" method="post" class="card p-4 shadow-sm mt-3">
                    <input type="hidden" th:field="*{id}">

                    <!-- Mã Sinh Viên -->
                    <div class="mb-3">
                        <label class="form-label">Mã sinh viên</label>
                        <input type="text" th:field="*{studentCode}" class="form-control">
                        <span class="text-danger" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></span>
                    </div>

                    <!-- Họ Tên -->
                    <div class="mb-3">
                        <label class="form-label">Họ tên</label>
                        <input type="text" th:field="*{fullName}" class="form-control">
                        <span class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                        <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <!-- Lớp -->
                    <div class="mb-3">
                        <label class="form-label">Lớp</label>
                        <input type="text" th:field="*{className}" class="form-control">
                        <span class="text-danger" th:if="${#fields.hasErrors('className')}" th:errors="*{className}"></span>
                    </div>

                    <!-- Nút bấm -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
