<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Danh Sách Sinh Viên</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-4">
        <!-- Tiêu đề & Nút thêm mới -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Danh Sách Sinh Viên</h2>
            <a th:href="@{/students/create}" class="btn btn-primary">+ Thêm Sinh Viên</a>
        </div>

        <!-- Bảng danh sách sinh viên -->
        <table class="table table-bordered table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Mã SV</th>
                    <th>Họ Tên</th>
                    <th>Email</th>
                    <th>Lớp</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}">1</td>
                    <td th:text="${student.studentCode}">SV001</td>
                    <td th:text="${student.fullName}">Nguyễn Văn A</td>
                    <td th:text="${student.email}">a@gmail.com</td>
                    <td th:text="${student.className}">CNTT1</td>
                    <td>
                        <!-- Nút Xem chi tiết (Bài 6) -->
                        <a th:href="@{/students/detail/{id}(id=${student.id})}" class="btn btn-sm btn-info text-white">Xem</a>
                        <!-- Nút Sửa -->
                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-warning">Sửa</a>
                        <!-- Nút Xóa -->
                        <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                           class="btn btn-sm btn-danger" 
                           onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?');">Xóa</a>
                    </td>
                </tr>
                <!-- Dòng hiển thị nếu danh sách trống -->
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="6" class="text-center text-muted">Chưa có sinh viên nào trong danh sách.</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
