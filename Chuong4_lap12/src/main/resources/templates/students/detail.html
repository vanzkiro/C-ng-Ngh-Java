<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Chi Tiết Sinh Viên</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-info text-white">
                        <h3 class="card-title mb-0">Thông Tin Chi Tiết Sinh Viên</h3>
                    </div>
                    <div class="card-body" th:object="${student}">
                        <p><strong>ID:</strong> <span th:text="*{id}">1</span></p>
                        <p><strong>Mã sinh viên:</strong> <span th:text="*{studentCode}">SV001</span></p>
                        <p><strong>Họ và tên:</strong> <span th:text="*{fullName}">Nguyễn Văn A</span></p>
                        <p><strong>Email:</strong> <span th:text="*{email}">a@gmail.com</span></p>
                        <p><strong>Lớp:</strong> <span th:text="*{className}">CNTT1</span></p>
                    </div>
                    <div class="card-footer d-flex gap-2">
                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning">Sửa</a>
                        <a th:href="@{/students}" class="btn btn-secondary">Quay lại danh sách</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
